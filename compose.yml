services:
  roundcube:
    image: ghcr.io/Wu-Wu/docker-roundcubemail:1.6.16-re5
    container_name: roundcube
    hostname: roundcube
    env_file:
      - ./roundcube.env
    volumes:
      - ./x/config:/config
      - ./x/data:/data
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - rc-private
    restart: unless-stopped

networks:
  rc-private:
    ipam:
      driver: default
      config:
        - subnet: "172.16.155.0/24"
