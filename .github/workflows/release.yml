name: Build and Release

# Публикация: git tag <app>-re<N> -> сборка на нативных раннерах обеих арок ->
# мультиарх-манифест <tag> и latest в docker.io/<DOCKERHUB_USER>/roundcubemail
# и в ghcr.io/wu-wu/roundcubemail (пуш встроенным GITHUB_TOKEN, секреты не нужны).
# Требуется заранее: secret DOCKERHUB_TOKEN (read/write PAT) и variable
# DOCKERHUB_USER (namespace на hub.docker.com). Логин держим именно
# переменой: значение любого registered secret Actions вымарывает ***
# во всех логах и step summary, включая имена образов в summary.
# Опционально (приватный registry за docker_auth): variables
# CRXHUB_HOSTNAME/CRXHUB_USERNAME + secret CRXHUB_PASSWORD. Пуш в него —
# третьим адресатом в build/publish, в Step Summary и release notes не
# упоминается намеренно. Это best-effort: сбой приватного реестра даёт
# ::warning:: и не валит пайплайн (в отличие от публичных адресатов).
# CRXHUB_HOSTNAME пуст -> приватные шаги пропускаются.
# PR собирают без публикации; ежедневный schedule страхует теги, пропущенные
# push-событием (needs_build=false, когда образ тега уже в ghcr).

on:
  push:
    tags:
      - "*"
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.DOCKERHUB_USER != '' && format('{0}/roundcubemail', vars.DOCKERHUB_USER) || 'wuwux/roundcubemail' }}
  IMAGE_GHCR: ghcr.io/wu-wu/roundcubemail
  # пустой CRXHUB_HOSTNAME -> пустая строка -> приватные шаги пропускаются
  IMAGE_CRXHUB: ${{ vars.CRXHUB_HOSTNAME != '' && format('{0}/utils/roundcubemail', vars.CRXHUB_HOSTNAME) || '' }}

jobs:
  check-new-tag:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.detect.outputs.needs_build }}
      tag: ${{ steps.detect.outputs.tag }}
      app_version: ${{ steps.detect.outputs.app_version }}
    steps:
      - name: Detect latest tag and whether its image exists
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_GHCR: ${{ env.IMAGE_GHCR }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/tags?per_page=100" \
                --paginate -q '.[].name' | sort -V | tail -n 1)
          if [ -z "${tag}" ]; then
            echo "No tags in the repository, nothing to build."
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # tag format: <app version>-re<N>; PR builds test the latest release
          app_version="${tag%%-*}"
          echo "Latest tag: ${tag} (roundcube ${app_version})"
          # anonymous pull credentials: a 404 manifest means "not built yet"
          ghcr_token=$(curl -fsSL \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${IMAGE_GHCR#ghcr.io/}:pull" \
            | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${ghcr_token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${IMAGE_GHCR#ghcr.io/}/manifests/${tag}")
          if [ "${code}" = "200" ]; then
            echo "Image for ${tag} is already published."
            needs_build=false
          else
            needs_build=true
          fi
          {
            echo "tag=${tag}"
            echo "app_version=${app_version}"
            echo "needs_build=${needs_build}"
          } >> "$GITHUB_OUTPUT"
        shell: bash

  build:
    needs: check-new-tag
    # PRs always build (validation only, nothing is pushed); manual dispatch
    # always builds and publishes the sha-tagged image (credentials smoke-test,
    # rebuild of the current main) even when the latest tag is already out
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      needs.check-new-tag.outputs.needs_build == 'true'
    permissions:
      packages: write   # пуш промежуточных -amd64/-arm64 в ghcr под GITHUB_TOKEN
    strategy:
      fail-fast: false   # падение одной арки не отменяет вторую
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm   # нативный arm64, бесплатно для публичных репо
    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.arch }})   # стабильный context для required checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USER || 'wuwux' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to private registry
        if: github.event_name != 'pull_request' && vars.CRXHUB_HOSTNAME != ''
        continue-on-error: true   # best-effort: сбой приватного реестра не валит билд
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.CRXHUB_HOSTNAME }}
          username: ${{ vars.CRXHUB_USERNAME }}
          password: ${{ secrets.CRXHUB_PASSWORD }}

      - name: Compose build args
        id: args
        run: |
          set -euo pipefail
          # тег образа: push по тегу -> его имя; PR/dispatch -> sha-префикс
          # (GITHUB_REF_NAME на PR это "N/merge", слэш недопустим в docker-теге)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            app_version="${GITHUB_REF_NAME%%-*}"
          else
            tag="sha-${GITHUB_SHA::12}"
            app_version="${{ needs.check-new-tag.outputs.app_version }}"
          fi
          {
            echo "tag=${tag}"
            echo "app_version=${app_version}"
            echo "revision=$(git describe --match=none --always --abbrev=8 --dirty)"
            echo "build_date=$(date -u +%FT%T)"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build (native ${{ matrix.arch }})
        run: |
          docker build --platform "linux/${{ matrix.arch }}" \
            -t "$IMAGE:${{ steps.args.outputs.tag }}-${{ matrix.arch }}" \
            -t "$IMAGE_GHCR:${{ steps.args.outputs.tag }}-${{ matrix.arch }}" \
            --build-arg BUILD_VERSION=${{ steps.args.outputs.tag }} \
            --build-arg BUILD_DATE=${{ steps.args.outputs.build_date }} \
            --build-arg BUILD_REVISION=${{ steps.args.outputs.revision }} \
            --build-arg APP_VERSION=${{ steps.args.outputs.app_version }} \
            .

      - name: Smoke test (native ${{ matrix.arch }})
        run: |
          # контракт потребителя: PHP-модули, которые Dockerfile обещает
          # roundcube, на месте и загружаются; сам roundcube провалидирован;
          # словарь aspell для ru виден pspell. Провал — до всякого пуша.
          set -eu
          IMG="$IMAGE_GHCR:${{ steps.args.outputs.tag }}-${{ matrix.arch }}"
          docker run --rm --entrypoint /usr/bin/php83 "$IMG" -m \
            | grep -qxF dom
          docker run --rm --entrypoint /usr/bin/php83 "$IMG" -m \
            | grep -qxF intl
          docker run --rm --entrypoint /usr/bin/php83 "$IMG" -m \
            | grep -qxF pspell
          docker run --rm --entrypoint /usr/bin/php83 "$IMG" -m \
            | grep -qxF imagick
          docker run --rm --entrypoint /usr/bin/php83 "$IMG" -m \
            | grep -qxF redis
          docker run --rm --entrypoint /usr/bin/php83 "$IMG" -r \
            'exit(is_file("/app/www/src/index.php") && is_dir("/app/www/src/program") ? 0 : 1);'
          echo "smoke ok on ${{ matrix.arch }}"

      - name: Push (native ${{ matrix.arch }})
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          TAG="${{ steps.args.outputs.tag }}"
          docker push "$IMAGE:$TAG-${{ matrix.arch }}"
          docker push "$IMAGE_GHCR:$TAG-${{ matrix.arch }}"
          if [[ -n "$IMAGE_CRXHUB" ]]; then
            docker tag "$IMAGE_GHCR:$TAG-${{ matrix.arch }}" "$IMAGE_CRXHUB:$TAG-${{ matrix.arch }}"
            if ! docker push "$IMAGE_CRXHUB:$TAG-${{ matrix.arch }}"; then
              echo "::warning::private registry push failed for linux/${{ matrix.arch }}"
            fi
          fi

  publish:
    needs: [check-new-tag, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USER || 'wuwux' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to private registry
        if: vars.CRXHUB_HOSTNAME != ''
        continue-on-error: true   # best-effort
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.CRXHUB_HOSTNAME }}
          username: ${{ vars.CRXHUB_USERNAME }}
          password: ${{ secrets.CRXHUB_PASSWORD }}

      - name: Compose multi-arch manifest
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="sha-${GITHUB_SHA::12}"; fi
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" \
            "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          docker buildx imagetools create \
            -t "$IMAGE_GHCR:$TAG" -t "$IMAGE_GHCR:latest" \
            "$IMAGE_GHCR:$TAG-amd64" "$IMAGE_GHCR:$TAG-arm64"
          # приватный адресат — отдельным best-effort шагом ниже
          {
            echo "## Итог"
            echo '```'
            docker buildx imagetools inspect "$IMAGE:$TAG"
            echo '```'
            echo '```'
            docker buildx imagetools inspect "$IMAGE_GHCR:$TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish private registry manifest (best-effort)
        if: vars.CRXHUB_HOSTNAME != ''
        continue-on-error: true   # сбой приватного реестра не валит publish/release
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="sha-${GITHUB_SHA::12}"; fi
          docker buildx imagetools create \
            -t "$IMAGE_CRXHUB:$TAG" -t "$IMAGE_CRXHUB:latest" \
            "$IMAGE_CRXHUB:$TAG-amd64" "$IMAGE_CRXHUB:$TAG-arm64"
        shell: bash

  release:
    needs: [check-new-tag, publish]
    if: >-
      github.event_name != 'pull_request' &&
      needs.check-new-tag.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-new-tag.outputs.tag }}
          IMAGE: ${{ env.IMAGE }}
          IMAGE_GHCR: ${{ env.IMAGE_GHCR }}
        run: |
          set -euo pipefail
          # heredoc без кавычек: $-переменные нужны, но markdown-бэктики
          # экранируем, иначе bash выполняет их как command substitution
          cat > notes.md <<EOF
          Roundcube Webmail \`${TAG%%-*}\` (image revision \`${TAG}\`) — multi-arch amd64+arm64.

          Container images for this release:
          - Docker Hub: \`docker.io/${IMAGE}:${TAG}\` · \`docker.io/${IMAGE}:latest\`
          - GitHub Container Registry: \`${IMAGE_GHCR}:${TAG}\` · \`${IMAGE_GHCR}:latest\`
          EOF
          # job без checkout: gh не определит репо из git, нужен явный -R
          if gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${TAG}" -R "${GITHUB_REPOSITORY}" --notes-file notes.md
          else
            gh release create "${TAG}" -R "${GITHUB_REPOSITORY}" --title "${TAG}" --notes-file notes.md
          fi
        shell: bash
