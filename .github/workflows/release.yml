name: Build and Release

on:
  push:
    tags:
      - "*"
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/wu-wu/roundcubemail

jobs:
  check-new-tag:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.detect.outputs.needs_build }}
      tag: ${{ steps.detect.outputs.tag }}
      app_version: ${{ steps.detect.outputs.app_version }}
    steps:
      - name: Detect latest tag and whether its image exists
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/tags?per_page=100" \
                --paginate -q '.[].name' | sort -V | tail -n 1)
          if [ -z "${tag}" ]; then
            echo "No tags in the repository, nothing to build."
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # tag format: <app version>-re<N>; PR builds test the latest release
          app_version="${tag%%-*}"
          echo "Latest tag: ${tag} (roundcube ${app_version})"
          # anonymous pull credentials: a 404 manifest means "not built yet"
          ghcr_token=$(curl -fsSL \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${IMAGE#ghcr.io/}:pull" \
            | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${ghcr_token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/${tag}")
          if [ "${code}" = "200" ]; then
            echo "Image for ${tag} is already published."
            needs_build=false
          else
            needs_build=true
          fi
          {
            echo "tag=${tag}"
            echo "app_version=${app_version}"
            echo "needs_build=${needs_build}"
          } >> "$GITHUB_OUTPUT"
        shell: bash

  build:
    needs: check-new-tag
    # PRs always build (validation only, nothing is pushed)
    if: >-
      github.event_name == 'pull_request' ||
      needs.check-new-tag.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compose build args
        id: args
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # never derive tags from GITHUB_REF_NAME: on PRs it is "N/merge",
            # a slash is not valid in a docker tag
            version="pr-${GITHUB_SHA:0:12}"
            push=false
          else
            version="${{ needs.check-new-tag.outputs.tag }}"
            push=true
          fi
          {
            echo "version=${version}"
            echo "push=${push}"
            echo "revision=$(git describe --match=none --always --abbrev=8 --dirty)"
            echo "build_date=$(date -u +%FT%T)"
            echo "app_version=${{ needs.check-new-tag.outputs.app_version }}"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: steps.args.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.args.outputs.push }}
          file: Dockerfile
          build-args: |
            BUILD_VERSION=${{ steps.args.outputs.version }}
            BUILD_DATE=${{ steps.args.outputs.build_date }}
            BUILD_REVISION=${{ steps.args.outputs.revision }}
            APP_VERSION=${{ steps.args.outputs.app_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:${{ steps.args.outputs.version }}
            ${{ steps.args.outputs.push == 'true' && format('{0}:latest', env.IMAGE) || '' }}

  release:
    needs: [check-new-tag, build]
    if: >-
      github.event_name != 'pull_request' &&
      needs.check-new-tag.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-new-tag.outputs.tag }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
            exit 0
          fi
          notes="Container images for this release:"$'\n'"- \`${IMAGE}:${TAG}\`"
          gh release create "${TAG}" --title "${TAG}" --notes "${notes}"
        shell: bash
